name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Race tests
        run: go test -race ./...

      - name: Chaos smoke run
        run: go test -race -count=3 -run TestChaos ./tests/
